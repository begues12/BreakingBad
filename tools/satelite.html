<script src="../js/interiors/plans.js"></script>
<script>
"use strict";
// Vista cenital del mapa con el mismo render del juego.
// Parámetros (#): x,y,w,h = zona del mundo (por defecto todo) · px = ancho de la imagen en píxeles
// Ej.: tools/satelite.html#x=5000&y=9000&w=3000&h=2000&px=1800
newGame(); G.camLock=true;
const q=new URLSearchParams(location.hash.slice(1));
const X=+(q.get('x')||0), Y=+(q.get('y')||0), Wd=+(q.get('w')||WW), Hd=+(q.get('h')||WH), PX=+(q.get('px')||1600);
const sc=PX/Wd, out=document.getElementById('out'); out.width=PX; out.height=Math.round(Hd*sc);
initRender();
const og=out.getContext('2d'), saved=ctx; ctx=og;
ctx.setTransform(sc,0,0,sc,-X*sc,-Y*sc);
drawStatic(X,Y,X+Wd,Y+Hd,[]);
// edificios (tejado sobre su planta) y árboles
for(const tr of treesIn(X,Y,X+Wd,Y+Hd)) drawTreeSprite(tr);
for(const s of solidsIn(X,Y,X+Wd,Y+Hd)){ if(s.kind==='cactus') continue; ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(s.x+4,s.y+5,s.w,s.h); drawRoof(s,s.x,s.y); }
// tableros elevados: cámara centrada en la zona para la perspectiva
cam.z=sc; cam.x=X; cam.y=Y; VW=Wd*sc; VH=Hd*sc; drawOverpasses();
if(q.has('labels')){ ctx.font=(14/sc)+'px sans-serif'; ctx.fillStyle='#ff0'; for(const k in LOC){ const L=LOC[k]; if(L.x<X||L.x>X+Wd||L.y<Y||L.y>Y+Hd) continue; ctx.fillText(L.name,L.x,L.y); } }
ctx=saved; document.title='listo';
</script>
</body>
</html>
