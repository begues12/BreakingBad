<script>
"use strict";
// ======================= CONFIG / MUNDO =======================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let VW = 0, VH = 0;
function resize(){ VW = cv.width = innerWidth; VH = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// El trazado se diseña en "unidades de diseño" y luego se escala por SC al mundo real
const SC = 1.5;
const WW = 6400*SC, WH = 5600*SC;

function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const srand = mulberry(1987);
const rand = (a,b)=>a+Math.random()*(b-a);
const sr = (a,b)=>a+srand()*(b-a);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const dist = (a,b,c,d)=>Math.hypot(a-c,b-d);
const angDiff = (a,b)=>{ let d=b-a; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; };
function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, l=dx*dx+dy*dy; let t=l?((px-x1)*dx+(py-y1)*dy)/l:0; t=clamp(t,0,1);
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function catmull(pts,sub){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let k=0;k<sub;k++){
      const t=k/sub,t2=t*t,t3=t2*t, f=j=>0.5*((2*p1[j])+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);
      out.push([f(0),f(1)]);
    }
  }
  out.push(pts[pts.length-1]); return out;
}

// ======================= GEOGRAFÍA DE ALBUQUERQUE =======================
// Río Grande (de norte a sur, por el oeste del centro)
const RIVER_W = 130*SC;
const RIVER = catmull([[1350,-80],[1500,700],[1750,1400],[1950,2200],[2150,2900],[2250,3500],[2150,4200],[2350,4900],[2500,5700]],10);
function riverDist(x,y){ let m=1e9; for(let i=0;i<RIVER.length-1;i++){ const a=RIVER[i],b=RIVER[i+1]; if(Math.abs(y-a[1])>600&&Math.abs(y-b[1])>600) continue; m=Math.min(m,segDist(x,y,a[0],a[1],b[0],b[1])); } return m; }
function riverX(y){ for(let i=0;i<RIVER.length-1;i++){ const a=RIVER[i],b=RIVER[i+1]; if(y>=a[1]&&y<=b[1]) return a[0]+(b[0]-a[0])*(y-a[1])/((b[1]-a[1])||1); } return 2000*SC; }
function isDesert(x,y){ x/=SC; y/=SC; return (x>3300&&y>3780) || x>6120 || (x<170) || (y>5250&&x>2900); }
function desertness(x,y){
  x/=SC; y/=SC;
  return Math.max(clamp(Math.min(x-3300,y-3780)/260,0,1), clamp((x-6120)/200,0,1), clamp((170-x)/150,0,1), clamp(Math.min(y-5250,x-2900)/200,0,1));
}

// --- carreteras ---
const RW = {hwy:255, main:186, street:138, dirt:114};
const RDEF = [];
// comprueba que una calle nueva no se monte sobre otra (paralelas pegadas, cruces muy oblicuos, bucles o el río)
function roadOK(pts,kind){
  const w=RW[kind]/SC;
  for(const p of pts){ if(p[0]<80||p[1]<80||p[0]>6320||p[1]>5520) return false; if(riverDist(p[0],p[1])<65+w/2+40) return false; }
  for(let i=0;i<pts.length;i++) for(let j=i+14;j<pts.length;j++) if(dist(pts[i][0],pts[i][1],pts[j][0],pts[j][1])<w*1.4) return false;
  for(let i=1;i<pts.length-1;i+=2){
    const p=pts[i], dx=pts[i+1][0]-pts[i-1][0], dy=pts[i+1][1]-pts[i-1][1], dl=Math.hypot(dx,dy)||1;
    for(const o of RDEF){ const wo=RW[o.kind]/SC, lim=(w+wo)/2+70;
      for(let k=0;k<o.pts.length-1;k++){ const a=o.pts[k], b=o.pts[k+1];
        if(Math.abs(p[0]-a[0])>lim+300&&Math.abs(p[0]-b[0])>lim+300) continue;
        if(Math.abs(p[1]-a[1])>lim+300&&Math.abs(p[1]-b[1])>lim+300) continue;
        if(segDist(p[0],p[1],a[0],a[1],b[0],b[1])>=lim) continue;
        const ex=b[0]-a[0], ey=b[1]-a[1], el=Math.hypot(ex,ey)||1;
        if(Math.abs(dx*ey-dy*ex)/(dl*el)<0.7) return false;
      } }
  }
  return true;
}
const RING=150; // la circunvalación va a esta distancia del borde (unidades de diseño)
function road(name,kind,pts,sub,check){
  const m=kind==='hwy'?0:-14;
  pts=pts.map(p=>[clamp(p[0],RING+m,6400-RING-m),clamp(p[1],RING+m,5600-RING-m)]);
  const d=catmull(pts,sub||8);
  if(check && !roadOK(d,kind)) return false;
  RDEF.push({name,kind,pts:d}); return true;
}
(function(){ // circunvalación con esquinas redondeadas
  const x0=RING,y0=RING,x1=6400-RING,y1=5600-RING,rc=420, pts=[];
  const arc=(cx,cy,a0)=>{ for(let k=0;k<=8;k++){ const a=a0+k/8*Math.PI/2; pts.push([cx+Math.cos(a)*rc,cy+Math.sin(a)*rc]); } };
  pts.push([x0+rc,y0]); pts.push([x1-rc,y0]); arc(x1-rc,y0+rc,-Math.PI/2); pts.push([x1,y1-rc]); arc(x1-rc,y1-rc,0);
  pts.push([x0+rc,y1]); arc(x0+rc,y1-rc,Math.PI/2); pts.push([x0,y0+rc]); arc(x0+rc,y0+rc,Math.PI); pts.push([x0+rc+1,y0]);
  // tramos rectos densos para que los cruces se detecten bien
  const dense=[]; for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1],n=Math.max(1,Math.ceil(dist(a[0],a[1],b[0],b[1])/120)); for(let k=0;k<n;k++) dense.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]); }
  dense.push(pts[pts.length-1]);
  RDEF.push({name:'Circunvalación','kind':'main',pts:dense});
})();
road('I-25','hwy',[[3520,-80],[3480,1200],[3380,2300],[3300,2650],[3180,3400],[3020,4200],[2780,5000],[2660,5700]]);
road('I-40','hwy',[[-80,2330],[900,2440],[1700,2560],[2600,2620],[3300,2650],[4300,2600],[5300,2500],[6480,2340]]);
road('Central Ave (Ruta 66)','main',[[-80,3150],[1200,3200],[2200,3215],[2900,3110],[3700,3150],[5000,3120],[6480,3060]]);
road('Paseo del Norte','main',[[230,820],[1000,900],[1600,950],[2600,860],[3500,800],[4600,760],[6000,700]]);
road('Montaño','main',[[1040,1650],[1800,1720],[2600,1660],[3480,1600]]);
road('Coors Blvd','main',[[880,-80],[1050,800],[1200,1600],[1350,2450],[1450,3200],[1520,4000],[1720,4800],[1900,5700]]);
road('Unser Blvd','main',[[300,430],[350,1500],[450,2400],[520,3200],[650,4300],[760,4700]]);
road('Tramway','main',[[5980,240],[6060,1500],[5960,2600],[5800,3200],[5600,3700]]);
road('Gibson Blvd','main',[[2900,3700],[3900,3780],[4700,4000]]);
road('Rio Bravo','main',[[1500,4400],[2150,4380],[2700,4350],[3060,4330]]);
road('Lomas Blvd','main',[[2700,2860],[3500,2900],[4500,2880],[5800,2850]]);
road('Montgomery Blvd','main',[[3420,1960],[4500,1990],[5900,1950]]);
road('Camino del desierto','dirt',[[4640,3985],[5100,4300],[5350,4650],[5550,5200],[5700,5650]]);
road('Rio Grande Blvd','street',[[2000,540],[2150,1400],[2380,2200],[2520,2900],[2560,3240]]);
road('Isleta Blvd','street',[[2420,3140],[2470,4000],[2560,4800],[2620,5700]]);
road('4th Street','street',[[2700,540],[2760,1400],[2860,2250],[2880,2700]],8,true);
road('Academy Rd','street',[[3460,1250],[4400,1220],[5300,1180],[6010,1150]],6,true);
// Downtown: dos calles que cruzan Central y Lomas
road('Downtown 1st','street',[[2760,2600],[2770,2990],[2780,3420]],4,true);
road('Downtown 3rd','street',[[3010,2690],[3020,2990],[3030,3380]],4,true);
// NE Heights: calles irregulares (no una cuadrícula perfecta)
for(let i=0;i<5;i++){
  const bx=3800+i*430; const pts=[];
  for(let y=300+sr(0,250); y<3700; y+=sr(330,470)) pts.push([bx+sr(-50,50)+y*0.03, y]);
  if(pts.length>2) road('Calle NE '+(i+1),'street',pts,6,true);
}
for(let j=0;j<4;j++){
  const by=[420,2280,3380,1600][j]+sr(-30,30); const pts=[];
  for(let x=3560+sr(0,120); x<5900; x+=sr(380,520)) pts.push([x, by+sr(-40,40)+x*0.02]);
  if(pts.length>2) road('Avenida NE '+(j+1),'street',pts,6,true);
}
// Westside: calles residenciales curvas (se descartan las que se pisan con otras)
for(let k=0,ok=0;k<90&&ok<16;k++){
  let x=sr(250,1500), y=sr(300,5100), a=sr(0,Math.PI*2); const pts=[[x,y]];
  for(let i=0;i<6;i++){
    a+=sr(-0.45,0.45); x+=Math.cos(a)*sr(230,320); y+=Math.sin(a)*sr(230,320);
    if(x<200||y<150||y>5450||x>riverX(y)-220) break;
    pts.push([x,y]);
  }
  if(pts.length>=3 && road('Calle residencial '+(ok+1),'street',pts,6,true)) ok++;
}
// South Valley / Barelas
for(let k=0,ok=0;k<40&&ok<6;k++){
  let x=sr(2350,2900), y=sr(3300,5200), a=sr(0,Math.PI*2); const pts=[[x,y]];
  for(let i=0;i<5;i++){ a+=sr(-0.5,0.5); x+=Math.cos(a)*sr(200,260); y+=Math.sin(a)*sr(200,260);
    if(x<riverX(y)+220||x>3000||y<3250||y>5450) break; pts.push([x,y]); }
  if(pts.length>=3 && road('Calle del valle '+(ok+1),'street',pts,6,true)) ok++;
}
// enlazar finales de calle sueltos con la calle más cercana que tengan delante
function onOtherRoad(p,self){
  for(const o of RDEF){ if(o===self) continue; if(self.kind!=='hwy' && o.kind==='hwy') continue; if(self.kind==='hwy' && o.kind!=='hwy' && o.name!=='Circunvalación') continue; const wo=RW[o.kind]/SC/2;
    for(let k=0;k<o.pts.length-1;k++){ const a=o.pts[k],b=o.pts[k+1]; if(segDist(p[0],p[1],a[0],a[1],b[0],b[1])<wo) return true; } }
  return false;
}
for(const r of RDEF){
  if(r.name==='Circunvalación') continue;
  for(const end of [0,1]){
    const P=end?r.pts[r.pts.length-1]:r.pts[0], Q=end?r.pts[r.pts.length-4]||r.pts[0]:r.pts[3]||r.pts[r.pts.length-1];
    if(onOtherRoad(P,r)) continue;
    const dx=P[0]-Q[0], dy=P[1]-Q[1], dl=Math.hypot(dx,dy)||1, ux=dx/dl, uy=dy/dl;
    let best=null, bd=900;
    for(const o of RDEF){ if(o===r) continue; if(r.kind==='hwy'?o.kind!=='hwy'&&o.name!=='Circunvalación':o.kind==='hwy') continue;
      for(let k=0;k<o.pts.length-1;k++){ const a=o.pts[k],b=o.pts[k+1];
        const ex=b[0]-a[0], ey=b[1]-a[1], l2=ex*ex+ey*ey||1, t=clamp(((P[0]-a[0])*ex+(P[1]-a[1])*ey)/l2,0,1);
        const cx=a[0]+ex*t, cy=a[1]+ey*t, d=dist(P[0],P[1],cx,cy);
        if(d>=bd||d<1) continue;
        if(((cx-P[0])*ux+(cy-P[1])*uy)/d<0.45) continue;               // tiene que estar más o menos delante
        let wet=false; for(let q=0;q<=10;q++){ if(riverDist(P[0]+(cx-P[0])*q/10,P[1]+(cy-P[1])*q/10)<90){ wet=true; break; } }
        if(wet) continue;
        bd=d; best=[cx,cy];
      } }
    if(!best) continue;
    const d=dist(P[0],P[1],best[0],best[1]), vx=(best[0]-P[0])/d, vy=(best[1]-P[1])/d;
    const add=[]; const n=Math.max(1,Math.ceil(d/100));
    for(let k=1;k<=n;k++) add.push([P[0]+vx*d*k/n,P[1]+vy*d*k/n]);
    add.push([best[0]+vx*12,best[1]+vy*12]); // un poco más allá del eje para que se detecte el cruce
    if(end) r.pts.push(...add); else r.pts.unshift(...add.reverse());
  }
}
// escalar todo al tamaño del mundo
for(const r of RDEF) r.pts=r.pts.map(p=>[p[0]*SC,p[1]*SC]);
for(const p of RIVER){ p[0]*=SC; p[1]*=SC; }

const ROADS = RDEF.map((r,idx)=>{
  const w=RW[r.kind]; const cum=[0];
  for(let i=1;i<r.pts.length;i++) cum.push(cum[i-1]+dist(r.pts[i-1][0],r.pts[i-1][1],r.pts[i][0],r.pts[i][1]));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; for(const p of r.pts){ x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]); }
  const path=new Path2D(); r.pts.forEach((p,i)=>i?path.lineTo(p[0],p[1]):path.moveTo(p[0],p[1]));
  return {idx,name:r.name,kind:r.kind,pts:r.pts,w,cum,len:cum[cum.length-1],path,bb:[x0-w,y0-w,x1+w,y1+w],cross:[],lane:r.kind==='hwy'?w*0.25:w*0.24};
});
function pointAt(r,s){
  s=clamp(s,0,r.len); let lo=0,hi=r.cum.length-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(r.cum[m]<=s) lo=m; else hi=m; }
  const a=r.pts[lo], b=r.pts[hi], L=(r.cum[hi]-r.cum[lo])||1, t=(s-r.cum[lo])/L;
  return {x:a[0]+(b[0]-a[0])*t, y:a[1]+(b[1]-a[1])*t, a:Math.atan2(b[1]-a[1],b[0]-a[0])};
}
// rejilla espacial de segmentos
const SEGC=160, SEGGRID=new Map();
const SEGS=[];
for(const r of ROADS) for(let i=0;i<r.pts.length-1;i++){
  const a=r.pts[i], b=r.pts[i+1];
  const sg={x1:a[0],y1:a[1],x2:b[0],y2:b[1],w:r.w,r,i,s0:r.cum[i]}; SEGS.push(sg);
  const pad=r.w/2+40;
  for(let cx=Math.floor((Math.min(a[0],b[0])-pad)/SEGC); cx<=Math.floor((Math.max(a[0],b[0])+pad)/SEGC); cx++)
  for(let cy=Math.floor((Math.min(a[1],b[1])-pad)/SEGC); cy<=Math.floor((Math.max(a[1],b[1])+pad)/SEGC); cy++){
    const k=cx*10000+cy; if(!SEGGRID.has(k)) SEGGRID.set(k,[]); SEGGRID.get(k).push(sg);
  }
}
function segsAt(x,y){ return SEGGRID.get(Math.floor(x/SEGC)*10000+Math.floor(y/SEGC))||[]; }
function roadAt(x,y,pad){ pad=pad||0; for(const s of segsAt(x,y)) if(segDist(x,y,s.x1,s.y1,s.x2,s.y2)<s.w/2+pad) return s; return null; }
// información de autopista en un punto: ¿sobre la calzada? y altura del puente (0..1)
function hwyInfo(x,y){
  let on=false, f=0;
  for(const sg of segsAt(x,y)){ if(sg.r.kind!=='hwy') continue; const d=segDist(x,y,sg.x1,sg.y1,sg.x2,sg.y2);
    if(d<sg.w/2) on=true;
    if(d<sg.w/2+80 && typeof liftF==='function'){ const dx=sg.x2-sg.x1, dy=sg.y2-sg.y1, l=Math.hypot(dx,dy)||1;
      const sv=sg.s0+clamp(((x-sg.x1)*dx+(y-sg.y1)*dy)/(l*l),0,1)*l; f=Math.max(f,liftF(sg.r,sv)); } }
  return {on,f};
}
// nivel: 0 = calle/suelo, 1 = autopista. Solo se cambia donde la autopista está a ras de suelo.
function layerAt(x,y,prev){
  const h=hwyInfo(x,y);
  if(prev===undefined) return h.on?1:0;
  if(prev===1){
    if(h.on) return 1;
    return h.f<0.12 ? 0 : 1;      // sobre el puente no se puede bajar (pretiles)
  }
  if(h.on && h.f<0.03) return 1;  // entrar en la autopista solo donde está a ras de suelo
  return 0;                       // bajo el puente sigues abajo
}
function isRoad(x,y){ if(x<0||y<0||x>WW||y>WH) return false; return !!roadAt(x,y,0); }
function nearestRoad(x,y,filter){
  let best=null,bd=1e9;
  for(const s of SEGS){ if(filter&&!filter(s.r)) continue; const d=segDist(x,y,s.x1,s.y1,s.x2,s.y2); if(d<bd){bd=d;best=s;} }
  const dx=best.x2-best.x1, dy=best.y2-best.y1, l=dx*dx+dy*dy; const t=clamp(((x-best.x1)*dx+(y-best.y1)*dy)/l,0,1);
  return {seg:best, r:best.r, x:best.x1+dx*t, y:best.y1+dy*t, s:best.s0+Math.sqrt(l)*t, a:Math.atan2(dy,dx), d:bd};
}
// cruces entre carreteras
const CROSSINGS=[];
(function(){
  const seen=new Set();
  for(const [k,list] of SEGGRID) for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
    const A=list[i], Bs=list[j]; if(A.r===Bs.r) continue;
    const key=SEGS.indexOf(A)+'_'+SEGS.indexOf(Bs); if(seen.has(key)) continue; seen.add(key);
    const d1x=A.x2-A.x1,d1y=A.y2-A.y1,d2x=Bs.x2-Bs.x1,d2y=Bs.y2-Bs.y1, den=d1x*d2y-d1y*d2x; if(Math.abs(den)<1e-6) continue;
    const t=((Bs.x1-A.x1)*d2y-(Bs.y1-A.y1)*d2x)/den, u=((Bs.x1-A.x1)*d1y-(Bs.y1-A.y1)*d1x)/den;
    if(t<0||t>1||u<0||u>1) continue;
    const x=A.x1+t*d1x, y=A.y1+t*d1y;
    if(CROSSINGS.some(c=>dist(c.x,c.y,x,y)<20)) continue;
    const id=CROSSINGS.length, sa=A.s0+Math.hypot(d1x,d1y)*t, sb=Bs.s0+Math.hypot(d2x,d2y)*u;
    const level=(A.r.kind==='hwy')===(Bs.r.kind==='hwy') || A.r.name==='Circunvalación' || Bs.r.name==='Circunvalación'; // calle bajo autopista = paso elevado; la circunvalación enlaza a nivel
    CROSSINGS.push({id,x,y,a:A.r,b:Bs.r,level,w:Math.max(A.r.w,Bs.r.w),sa,sb});
    if(level){ A.r.cross.push({id,s:sa,other:Bs.r.idx,os:sb}); Bs.r.cross.push({id,s:sb,other:A.r.idx,os:sa}); }
  }
})();

// --- Lugares de la historia (se colocan junto a la calle más cercana) ---
const LOC = {
  home:    {tx:4520,ty:1830, name:'Casa White',            roof:'#8b6b4a', wall:'#d8c8a8', size:[170,120]},
  jesse:   {tx:4250,ty:3330, name:'Casa de Jesse',         roof:'#5d4f6e', wall:'#b9a98f', size:[170,120]},
  rvlot:   {tx:2650,ty:3900, name:'Autocaravanas',         roof:'#6f6f6f', wall:'#aaa'},
  tuco:    {tx:2720,ty:4520, name:'Desguace Salamanca',    roof:'#4f4232', wall:'#7a6a55'},
  saul:    {tx:4950,ty:2960, name:'Saul Goodman & Asoc.',  roof:'#b39a55', wall:'#e8dcb0'},
  pollos:  {tx:3800,ty:1080, name:'Los Pollos Hermanos',   roof:'#e3b22c', wall:'#c0392b'},
  carwash: {tx:5150,ty:1300, name:'Lavadero A1A',          roof:'#2f74b8', wall:'#d0e4f5'},
  dea:     {tx:3060,ty:2960, name:'DEA / Policía APD',     roof:'#2b3a4f', wall:'#8a96a6'},
  hospital:{tx:3650,ty:3320, name:'Hospital UNM',          roof:'#e9e9e9', wall:'#c8d5dd'},
  pawn:    {tx:1250,ty:2900, name:'Casa de Empeños',       roof:'#4f7a2e', wall:'#c7b98c'},
};
const solids = [];   // {x,y,w,h,roof,wall,name,kind}
const RESERVED = [];
const LOTS = [];
function placeLoc(L,tx,ty){
  const nr=nearestRoad(tx,ty,r=>r.kind==='main'||r.kind==='street');
  let nx=tx-nr.x, ny=ty-nr.y, nl=Math.hypot(nx,ny);
  if(nl<1){ nx=Math.cos(nr.a+Math.PI/2); ny=Math.sin(nr.a+Math.PI/2); nl=1; }
  nx/=nl; ny/=nl;
  const hw=nr.r.w/2, o={};
  o.x=nr.x+nx*(hw+50); o.y=nr.y+ny*(hw+50);
  o.parkX=o.x+Math.cos(nr.a)*75; o.parkY=o.y+Math.sin(nr.a)*75; o.parkA=nr.a;
  const sz=L.size||[230,150], horiz=Math.abs(nx)>Math.abs(ny);
  const bw=horiz?sz[1]:sz[0], bh=horiz?sz[0]:sz[1], D=hw+50+40+(horiz?bw:bh)/2;
  o.bx=nr.x+nx*D-bw/2; o.by=nr.y+ny*D-bh/2; o.bw=bw; o.bh=bh;
  // validar: edificio fuera de calles/río, parking y entrada libres
  for(let i=0;i<=6;i++) for(let j=0;j<=6;j++){ const x=o.bx-10+(bw+20)*i/6, y=o.by-10+(bh+20)*j/6;
    if(roadAt(x,y,4)||riverDist(x,y)<RIVER_W/2+40||isDesert(x,y)) return null; }
  for(const [x,y] of [[o.x,o.y],[o.parkX,o.parkY]]) if(riverDist(x,y)<RIVER_W/2+40) return null;
  if(roadAt(o.parkX,o.parkY,-nr.r.w/2+20)&&roadAt(o.parkX,o.parkY,0)&&roadAt(o.parkX,o.parkY,0).r!==nr.r) return null;
  for(const r of RESERVED) if(o.bx-30<r[2]&&o.bx+bw+30>r[0]&&o.by-30<r[3]&&o.by+bh+30>r[1]) return null;
  for(const [x,y] of [[o.x,o.y],[o.parkX,o.parkY]]){
    if(x>o.bx-30&&x<o.bx+bw+30&&y>o.by-30&&y<o.by+bh+30) return null;
    for(const q of solids) if(x>q.x-30&&x<q.x+q.w+30&&y>q.y-30&&y<q.y+q.h+30) return null;
    for(const r of RESERVED) if(x>r[0]-20&&x<r[2]+20&&y>r[1]-20&&y<r[3]+20) return null;
  }
  return o;
}

const SOLC=200, SOLGRID=new Map();
function addSolid(s){
  for(let cx=Math.floor(s.x/SOLC); cx<=Math.floor((s.x+s.w)/SOLC); cx++)
  for(let cy=Math.floor(s.y/SOLC); cy<=Math.floor((s.y+s.h)/SOLC); cy++){
    const k=cx*10000+cy; if(!SOLGRID.has(k)) SOLGRID.set(k,[]); SOLGRID.get(k).push(s);
  }
}
let qStamp=0;
function solidsIn(x0,y0,x1,y1){
  qStamp++; const out=[];
  for(let cx=Math.floor(x0/SOLC); cx<=Math.floor(x1/SOLC); cx++)
  for(let cy=Math.floor(y0/SOLC); cy<=Math.floor(y1/SOLC); cy++){
    const l=SOLGRID.get(cx*10000+cy); if(!l) continue;
    for(const s of l) if(s._q!==qStamp){ s._q=qStamp; out.push(s); }
  }
  return out;
}
solids.forEach(addSolid);

const ROOFS = ['#7d6a55','#8a7a66','#6e6258','#9b8467','#a08c70','#6b5f52','#857565','#5f5a55','#a56b4a','#b9a27f'];

function density(x,y){
  if(isDesert(x,y)) return 0;
  const dt=dist(x,y,2900*SC,3000*SC); if(dt<420*SC) return 0.95;
  if(x>3450*SC && y<3750*SC) return 0.85;          // NE Heights
  if(x<riverX(y)) return 0.6;                // Westside
  if(y>3300*SC) return 0.45;                    // South Valley
  return 0.7;
}
function canPlace(x,y,w,h){
  if(x<20||y<20||x+w>WW-20||y+h>WH-20) return false;
  for(const r of RESERVED) if(x<r[2]&&x+w>r[0]&&y<r[3]&&y+h>r[1]) return false;
  for(let i=0;i<=4;i++) for(let j=0;j<=4;j++){
    const px=x+w*i/4, py=y+h*j/4;
    if(roadAt(px,py,12)) return false;
    if(riverDist(px,py)<RIVER_W/2+60) return false;
  }
  for(const s of solidsIn(x-8,y-8,x+w+8,y+h+8)) if(x-8<s.x+s.w&&x+w+8>s.x&&y-8<s.y+s.h&&y+h+8>s.y) return false;
  return true;
}

    while(s<r.len-20){
      const p=pointAt(r,s), n=p.a+Math.PI/2*side, nx=Math.cos(n), ny=Math.sin(n);
      const dens=density(p.x,p.y);
      const big=r.kind==='main' || dist(p.x,p.y,2900*SC,3000*SC)<420*SC;

function canPlaceRock(x,y,w,h){
  for(let i=0;i<=4;i++) for(let j=0;j<=4;j++) if(roadAt(x+w*i/4,y+h*j/4,30)) return false;
  return !solidsIn(x,y,x+w,y+h).some(s=>x<s.x+s.w&&x+w>s.x&&y<s.y+s.h&&y+h>s.y);
}

function inWater(x,y){ return riverDist(x,y)<RIVER_W/2 && !isRoad(x,y); }
function hitSolid(x,y,r){
  for(const s of solidsIn(x-r,y-r,x+r,y+r)){
    if(x+r<s.x||x-r>s.x+s.w||y+r<s.y||y-r>s.y+s.h) continue;
    const cx=clamp(x,s.x,s.x+s.w), cy=clamp(y,s.y,s.y+s.h);
    if((x-cx)**2+(y-cy)**2<r*r) return s;
  }
  return null;
}
function resolve(o,r){ // empuja círculo fuera de los sólidos; devuelve true si chocó
  let hit=false;
  for(const s of solidsIn(o.x-r,o.y-r,o.x+r,o.y+r)){
    if(o.x+r<s.x||o.x-r>s.x+s.w||o.y+r<s.y||o.y-r>s.y+s.h) continue;
    const cx=clamp(o.x,s.x,s.x+s.w), cy=clamp(o.y,s.y,s.y+s.h);
    let dx=o.x-cx, dy=o.y-cy, d=Math.hypot(dx,dy);
    if(d<r){
      hit=true;
      if(d<0.001){
        const l=o.x-s.x, rr=s.x+s.w-o.x, t=o.y-s.y, b=s.y+s.h-o.y, m=Math.min(l,rr,t,b);
        if(m===l)o.x=s.x-r; else if(m===rr)o.x=s.x+s.w+r; else if(m===t)o.y=s.y-r; else o.y=s.y+s.h+r;
      } else { o.x=cx+dx/d*r; o.y=cy+dy/d*r; }
    }
  }
  // río (solo se cruza por los puentes) y bordes del mundo
  if(inWater(o.x,o.y)){ if(o._px!==undefined){ o.x=o._px; o.y=o._py; } hit=true; }
  if(o.x<r||o.y<r||o.x>WW-r||o.y>WH-r){ o.x=clamp(o.x,r,WW-r); o.y=clamp(o.y,r,WH-r); hit=true; }
  o._px=o.x; o._py=o.y;
  return hit;
}

const GS=12;

(function(){
  const g=groundCanvas.getContext('2d'), W=groundCanvas.width, H=groundCanvas.height, im=g.createImageData(W,H), d=im.data;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const wx=x*GS, wy=y*GS;
    const des=desertness(wx,wy);
    let r=188+(205-188)*des, gg=174+(174-174)*des, b=140+(118-140)*des;

    const rd=riverDist(wx,wy);
    if(rd<400){ const f=1-rd/400; r+=(104-r)*f; gg+=(128-gg)*f; b+=(72-b)*f; }
    const n=(Math.sin(wx*0.0021+Math.cos(wy*0.0017)*2)*Math.cos(wy*0.0023)*9) + ((Math.sin(wx*12.9898+wy*78.233)*43758.5453)%1)*10;
    const i=(y*W+x)*4; d[i]=r+n; d[i+1]=gg+n; d[i+2]=b+n*0.7; d[i+3]=255;
  }

// punto de calle aleatorio cerca del jugador (anillo rmin..rmax)
function roadPointNear(rmin,rmax,filter){
  const P=G.player;
  for(let t=0;t<12;t++){
    const ang=rand(0,Math.PI*2), d=rand(rmin,rmax), x=P.x+Math.cos(ang)*d, y=P.y+Math.sin(ang)*d;
    if(x<0||y<0||x>WW||y>WH) continue;

    const dd=dist(nr.x,nr.y,P.x,P.y); if(dd<rmin*0.8||dd>rmax*1.2) continue;
    return nr;
  }
  return null;
}

function updatePed(p,dt){
  const P=G.player;
  if(p.flee>0){
    p.flee-=dt; const a=Math.atan2(p.y-P.y,p.x-P.x); p.a=a+Math.sin(p.walk)*0.2;
    p.x+=Math.cos(p.a)*130*dt; p.y+=Math.sin(p.a)*130*dt; p.walk+=dt*14;
    resolve(p,7);
    if(p.flee<=0) attachPed(p);
    return;
  }
  if(p.mode==='go'||p.mode==='cross'){ // ir andando hasta un punto (cruzar o volver a la acera)
    const dx=p.tx-p.x, dy=p.ty-p.y, d=Math.hypot(dx,dy);
    p.goT=(p.goT||0)+dt; if(p.goT>6){ p.x=p.tx; p.y=p.ty; }
    if(d<3){ p.mode='walk'; p.goT=0; return; }
    p.a=Math.atan2(dy,dx); const st=Math.min(d,(p.mode==='cross'?p.sp*1.25:p.sp)*dt);
    p.x+=dx/d*st; p.y+=dy/d*st; p.walk+=dt*9;
    if(p.mode==='go') resolve(p,7);
    return;
  }
  const r=ROADS[p.road]; if(!r){ attachPed(p); return; }
  const ps=p.s; p.s+=p.dir*p.sp*dt;
  // cruces: decidir al llegar al borde de la otra calle
  for(const x of r.cross){
    const o=ROADS[x.other]; if(!PED_ROAD(o)) continue;
    const edge=x.s-p.dir*(o.w/2+16);
    if((edge-ps)*(edge-p.s)<=0 && p.lastX!==x.id){
      p.lastX=x.id; const rnd=Math.random();
      if(rnd<0.3){ // cruzar su propia calle por el paso de cebra
        p.s=edge; p.side=-p.side; const t=sidewalkPos(r,p.s,p.side); p.mode='cross'; p.tx=t.x; p.ty=t.y; return;
      } else if(rnd<0.6){ // girar por la acera de la otra calle
        const here=sidewalkPos(r,edge,p.side);
        const nr=nearestRoad(here.x,here.y,q=>q===o);
        const n=nr.a+Math.PI/2, side=((here.x-nr.x)*Math.cos(n)+(here.y-nr.y)*Math.sin(n))>=0?1:-1;
        p.road=o.idx; p.side=side; p.dir=(nr.s<x.os)?-1:1; p.s=nr.s+p.dir*10; p.lastX=x.id;
        const t=sidewalkPos(o,p.s,side); p.mode='go'; p.tx=t.x; p.ty=t.y; return;
      }
      // si no, sigue recto cruzando la otra calle por su paso de cebra
    }
  }
  if(p.s<=8){ p.s=8; p.dir=1; p.lastX=-1; } else if(p.s>=r.len-8){ p.s=r.len-8; p.dir=-1; p.lastX=-1; }
  const t=sidewalkPos(r,p.s,p.side);
  p.a=Math.atan2(t.y-p.y,t.x-p.x)||p.a; p.x=t.x; p.y=t.y; p.walk+=dt*8;
}

let AC=null;
function audio(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq,dur,type,vol,slide){
  const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,a.currentTime+dur);
  g.gain.value=vol||0.05; g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
}
function noise(dur,vol){
  const a=audio(); if(!a) return;
  const buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=a.createBufferSource(), g=a.createGain(); s.buffer=buf; g.gain.value=vol||0.15;
  s.connect(g); g.connect(a.destination); s.start();
}
const sfx = {
  shot:()=>noise(0.12,0.25), boom:()=>{noise(0.8,0.5);beep(80,0.6,'sawtooth',0.2,30);},
  crash:()=>noise(0.18,0.2), cash:()=>{beep(880,0.08,'square',0.05);setTimeout(()=>beep(1320,0.12,'square',0.05),80);},
  blip:()=>beep(600,0.04,'square',0.02), star:()=>beep(300,0.3,'sawtooth',0.06,600),
  phone:()=>{beep(1000,0.1,'sine',0.06);setTimeout(()=>beep(1000,0.1,'sine',0.06),150);},
};

// line: [who, text] | {choices:[[text, fn]]} | function
function say(lines, onEnd){
  G.dialog = {lines:lines.slice(), i:0, ch:0, onEnd, choiceSel:0};
  advanceToValid();
}
function advanceToValid(){
  const D=G.dialog;
  while(D && D.i<D.lines.length && typeof D.lines[D.i]==='function'){
    const fn=D.lines[D.i]; D.i++; const extra=fn(); if(Array.isArray(extra)) D.lines.splice(D.i,0,...extra);
  }
  if(D && D.i>=D.lines.length){ G.dialog=null; if(D.onEnd) D.onEnd(); }
}
function dialogNext(){
  const D=G.dialog, L=D.lines[D.i];
  if(L.choices) return;
  const txt=L[1];
  if(D.ch<txt.length){ D.ch=txt.length; return; }
  D.i++; D.ch=0; advanceToValid();
}
function dialogChoose(n){
  const D=G.dialog, L=D.lines[D.i];
  if(!L||!L.choices||!L.choices[n]) return;
  D.i++; D.ch=0;
  const extra = L.choices[n][1]();
  if(Array.isArray(extra)) D.lines.splice(D.i,0,...extra);
  advanceToValid();
}

function startCook(first){
  G.cook={t:0,dur:30,temp:40,band:68,bandW:12,inBand:0,total:0,ev:null,evT:rand(3,6),pen:0,first,done:false,res:null};
}
function updateCook(dt){
  const C=G.cook;
  if(C.done){ if(pressed[' ']||pressed['enter']||pressed['e']||mouse.clicked) finishCook(); return; }
  C.t+=dt;
  // la franja ideal se desplaza poco a poco
  C.band = 68 + Math.sin(C.t*0.35)*10 + Math.sin(C.t*1.3)*3;
  const up = keys['w']||keys['arrowup'], dn = keys['s']||keys['arrowdown'];
  C.temp += (up?38:0)*dt - (dn?38:0)*dt + Math.sin(C.t*2.1)*6*dt - 4*dt;
  C.temp = clamp(C.temp,0,100);
  C.total+=dt; if(Math.abs(C.temp-C.band)<C.bandW/2) C.inBand+=dt;
  if(C.temp>95){ C.pen+=dt*0.08; }
  // eventos
  C.evT-=dt;
  if(!C.ev && C.evT<=0){
    const opts=[['Q','¡Sube la presión! Abre la válvula'],['R','¡Remueve la mezcla!'],['F','¡Ajusta el filtro!'],['T','¡Comprueba el termómetro!']];
    const o=opts[(Math.random()*opts.length)|0]; C.ev={k:o[0].toLowerCase(),label:o[0],txt:o[1],t:1.8}; sfx.blip();
  }
  if(C.ev){
    C.ev.t-=dt;
    for(const k in pressed){ if(k.length===1 && k!=='w'&&k!=='s'){ if(k===C.ev.k){ floater(G.player.x,G.player.y-30,'¡Bien!','#7f7'); C.ev=null; C.evT=rand(3,6); } else { C.pen+=0.03; } break; } }
    if(C.ev && C.ev.t<=0){ C.pen+=0.06; C.ev=null; C.evT=rand(3,6); toast('Evento fallido: pureza reducida',2); }
  }
  if(C.t>=C.dur){
    const ratio=C.inBand/C.total;
    let pur=clamp(0.55+ratio*0.45-C.pen,0.3,0.991);
    const lbs=+(2+ratio*3).toFixed(1);
    C.done=true; C.res={pur,lbs};
  }
}
function finishCook(){
  const C=G.cook, r=C.res;
  // mezcla de pureza ponderada con el stock
  G.purity = G.product>0 ? (G.purity*G.product + r.pur*r.lbs)/(G.product+r.lbs) : r.pur;
  G.product = +(G.product + r.lbs).toFixed(1);
  G.heat += 5;
  const first=C.first; G.cook=null;
  const pct=(r.pur*100).toFixed(1);
  if(first){
    say([
      ['J','Tío... tío. Esto es arte. Es... ¡es azul! ¿Por qué es azul?'],
      ['W','Pureza del '+pct+'%. Lo que tú vendías antes no llegaba al setenta.'],
      ['J','¡Es usted un puto genio, señor White!'],
      ['W','Ahora hay que venderlo. Y no a tus amigos de veinte dólares.'],
      ['J','Conozco a alguien con dinero de verdad. Tuco Salamanca. Pero está como una cabra, tío. En serio.'],
    ], ()=>setStage(3));
  } else {
    toast('Cocina terminada: '+r.lbs+' lb al '+pct+'% de pureza',5);
    save();
  }
}

function setWanted(n){ n=clamp(n,0,5); if(n>G.wanted){ sfx.star(); } G.wanted=n; G.evadeT=0; }
function spawnThugs(n){
  const L=LOC.tuco;
  for(let i=0;i<n;i++){
    let x,y;
    for(let t=0;t<30;t++){ x=L.x+rand(-350,350); y=L.y+rand(80,350); if(!hitSolid(x,y,12)&&!inWater(x,y)&&dist(x,y,G.player.x,G.player.y)>200) break; }
    G.thugs.push({x,y,a:0,hp:60,cool:rand(1,2),col:'#222',walk:0});
  }
}
function fire(x,y,a,owner,spread,dmg){
  a+=rand(-spread,spread);
  G.bullets.push({x:x+Math.cos(a)*16,y:y+Math.sin(a)*16,vx:Math.cos(a)*1300,vy:Math.sin(a)*1300,life:0.7,owner,dmg:dmg||25});
  sfx.shot();
}
function hurtPlayer(d){
  const P=G.player;
  if(P.armor>0){ const ab=Math.min(P.armor,d*0.7); P.armor-=ab; d-=ab; }
  P.hp-=d; G.hurtFlash=0.3;
}
function explodeCar(c){
  c.dead=true; sfx.boom(); G.flash=Math.max(G.flash,0.6);
  for(let i=0;i<30;i++) G.parts.push({x:c.x,y:c.y,vx:rand(-250,250),vy:rand(-250,250),life:rand(.5,1.5),c:Math.random()<.6?'#f93':'#444',s:rand(5,14)});
  G.decals.push({x:c.x,y:c.y,r:40,c:'rgba(20,20,20,.6)'});
  const P=G.player;
  if(dist(c.x,c.y,P.x,P.y)<110){ hurtPlayer(P.inCar===c?100:45); }
  for(const p of G.peds) if(!p.dead && dist(p.x,p.y,c.x,c.y)<100) killPed(p);
  for(const t of G.thugs) if(dist(t.x,t.y,c.x,c.y)<100) t.hp=0;
  if(P.inCar===c){ P.inCar=null; }
  if(c.driver==='cop'){ setWanted(Math.max(G.wanted,3)); }
  c.driver=null; c.burnt=true; c.color='#2a2a2a'; c.v=0; c.vx=0; c.vy=0; c.av=0; c.fire=0; c.hp=0;
}
function killPed(p){
  p.dead=true; p.deadT=40;
  G.decals.push({x:p.x+rand(-5,5),y:p.y+rand(-5,5),r:rand(10,16),c:'rgba(120,0,0,.7)'});
  G.peds.forEach(o=>{ if(!o.dead&&dist(o.x,o.y,p.x,p.y)<300) o.flee=6; });
}

let cam={x:0,y:0,z:1};
let started=false, titleSel=0, paused=false;

function update(dt){
  const P=G.player;
  if(G.flash>0) G.flash-=dt*1.5;
  if(G.hurtFlash>0) G.hurtFlash-=dt;
  if(G.msgT>0) G.msgT-=dt;
  for(const f of G.floaters){ f.life-=dt; f.y-=30*dt; }
  G.floaters=G.floaters.filter(f=>f.life>0);

  if(G.dialog){
    const D=G.dialog, L=D.lines[D.i];
    if(L && !L.choices){ const prev=D.ch|0; D.ch=Math.min(L[1].length,D.ch+dt*55); if((D.ch|0)!==prev && (D.ch|0)%3===0) beep(220+Math.random()*80,0.02,'square',0.01); }
    if(L && L.choices){
      if(pressed['arrowup']||pressed['w']) D.choiceSel=(D.choiceSel+L.choices.length-1)%L.choices.length;
      if(pressed['arrowdown']||pressed['s']) D.choiceSel=(D.choiceSel+1)%L.choices.length;
      for(let i=0;i<L.choices.length;i++) if(pressed[String(i+1)]) { dialogChoose(i); return; }
      if(pressed['enter']||pressed[' ']||pressed['e']) { dialogChoose(D.choiceSel); return; }
      if(mouse.clicked && G._choiceRects){ for(const r of G._choiceRects) if(mouse.x>r.x&&mouse.x<r.x+r.w&&mouse.y>r.y&&mouse.y<r.y+r.h){ dialogChoose(r.i); return; } }
    } else if(pressed[' ']||pressed['enter']||pressed['e']||mouse.clicked) dialogNext();
    return;
  }
  if(G.cook){ updateCook(dt); return; }
  if(G.dead){ G.deadT-=dt; if(G.deadT<=0) respawn(); updateWorld(dt); return; }

  G.clock=(G.clock+dt*2)%(24*60);
  G.heat=Math.max(0,G.heat-dt*0.25);

  // --- jugador ---
  const car=P.inCar;
  P.layer=car?car.layer||0:layerAt(P.x,P.y,P.layer);
  if(car){
    driveCar(car,dt,keys['w']||keys['arrowup'],keys['s']||keys['arrowdown'],(keys['a']||keys['arrowleft']?-1:0)+(keys['d']||keys['arrowright']?1:0),keys[' ']);
    P.x=car.x; P.y=car.y; P.a=car.a;
    if(pressed['h']) beep(330,0.35,'sawtooth',0.05);
    if(car.dead){ P.inCar=null; }
    // atropellos
    if(Math.abs(car.v)>90 && !car.layer) for(const p of G.peds) if(!p.dead && dist(p.x,p.y,car.x,car.y)<car.r+6){ killPed(p); sfx.crash(); if(G.wanted<1||Math.random()<0.3) setWanted(G.wanted+1); }
    if(Math.abs(car.v)>90) for(const t of G.thugs) if(t.hp>0 && dist(t.x,t.y,car.x,car.y)<car.r+8){ t.hp=0; sfx.crash(); }
    if(Math.abs(car.v)>90) for(const o of G.officers) if(o.hp>0 && dist(o.x,o.y,car.x,car.y)<car.r+8){ o.hp=0; sfx.crash(); }
  } else {
    let mx=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);
    let my=(keys['s']||keys['arrowdown']?1:0)-(keys['w']||keys['arrowup']?1:0);
    const run=keys['shift']; const sp=run?190:115;
    if(mx||my){ const l=Math.hypot(mx,my); P.x+=mx/l*sp*dt; P.y+=my/l*sp*dt; P.walk+=dt*(run?14:9); }
    resolve(P,9);
    const wx=mouse.x/cam.z+cam.x, wy=mouse.y/cam.z+cam.y;
    P.a=Math.atan2(wy-P.y,wx-P.x);
    P.cool-=dt;
    if(mouse.down && P.gun && P.ammo>0 && P.cool<=0){
      fire(P.x,P.y,P.a,'player',0.04,34); P.ammo--; P.cool=0.28;
      G.peds.forEach(p=>{ if(!p.dead&&dist(p.x,p.y,P.x,P.y)<400) p.flee=6; });
      if(G.wanted<1 && G.thugs.length===0 && copNear(700)) setWanted(1);
    } else if(mouse.clicked && P.gun && P.ammo<=0) { toast('Sin munición. Cómprala en la Casa de Empeños.',2); }
  }

  // --- interacción (E) ---
  if(pressed['f']){ // F: subir/bajar del coche (como en GTA)
    if(car) exitCar();
    else { let best=null,bd=70; for(const c of G.cars){ if(c.dead||c.burnt) continue; const d=dist(c.x,c.y,P.x,P.y); if(d<bd){bd=d;best=c;} } if(best) enterCar(best); }
  } else if(pressed['e']){
    const m = nearMarker();
    if(m && (!car || Math.abs(car.v)<120)){ if(car){ car.v=0; car.vx=0; car.vy=0; car.av=0; } interact(m.key); }
    else if(car){ exitCar(); }
    else {
      let best=null,bd=60;
      for(const c of G.cars){ if(c.dead||c.burnt) continue; const d=dist(c.x,c.y,P.x,P.y); if(d<bd){bd=d;best=c;} }
      if(best) enterCar(best);
      else if(m) interact(m.key);
    }
  }
  if(car && pressed['e']===undefined){}

  updateWorld(dt);

  // --- objetivos dinámicos ---
  if(G.stage===4 && G.thugs.length===0){
    say([['J','(Llamada) ¿Señor White? ¿Está vivo? ...Joder, tío, es usted un animal.'],
         ['J','Oiga, con tanta pasta necesitamos un abogado. Uno que sea... ya sabe, criminal. Saul Goodman. Sale en la tele.']], ()=>setStage(5));
    sfx.phone();
  }
  if(G.stage===6 && G.money>=100000 && !G.dialog){
    sfx.phone();
    say([['SA','(Llamada) Walt, amigo mío. Tengo a alguien que quiere conocerte. Discreto, puntual, sin tatuajes en la cara.'],
         ['SA','Los Pollos Hermanos. Ve tú solo. Y por lo que más quieras: sé educado.']], ()=>setStage(7));
  }
  if(G.stage===9 && G.wanted===0){
    sfx.phone();
    say([['W','Los he despistado. Hank no sabe nada... todavía.'],
         ['SA','(Llamada) Walt, unos tipos de Phoenix están cocinando en tu territorio, copiando tu producto. Te esperan en el desierto. Ve y deja las cosas claras.']], ()=>setStage(10));
  }
  if(P.hp<=0 && !G.dead){ G.dead='wasted'; G.deadT=3.5; if(P.inCar){P.inCar=null;} sfx.boom(); }
}

function copNear(r){ return G.cars.some(c=>(c.driver==='cop')&&dist(c.x,c.y,G.player.x,G.player.y)<r); }

function nearMarker(){
  const P=G.player;
  for(const m of activeMarkers()) if(dist(m.x,m.y,P.x,P.y)<(m.key==='desert'?150:55)) return m;
  return null;
}
function activeMarkers(){
  const list=[], st=G.stage, S=STAGES[st];
  if(S && S.target) list.push(Object.assign({main:true},LOC[S.target]));
  list.push(Object.assign({svc:'+',col:'#e44'},LOC.hospital), Object.assign({svc:'$',col:'#4a4'},LOC.pawn), Object.assign({svc:'⌂',col:'#ccc'},LOC.home));
  if(st>=6) DEALERS.forEach((d,i)=>list.push({key:'dealer'+i,x:d.x,y:d.y,name:d.name,svc:'●',col:'#39f'}));
  if(st>=5 && (!S||S.target!=='tuco')) list.push(Object.assign({svc:'T',col:'#a33'},LOC.tuco));
  if(st>=3 && (!S||S.target!=='desert')) list.push(Object.assign({svc:'⚗',col:'#3cf'},DESERT));
  if(st<9) list.push(Object.assign({svc:'H',col:'#678'},LOC.dea));
  // eliminar duplicados
  const seen={}; return list.filter(m=>{ if(seen[m.key]) return false; seen[m.key]=1; return true; });

function enterCar(c){

  if(c.driver==='ai'||c.driver==='cop'){

    G.peds.push({x:c.x+Math.cos(c.a+Math.PI/2)*30,y:c.y+Math.sin(c.a+Math.PI/2)*30,a:0,sp:70,col:c.driver==='cop'?'#124':'#888',skin:'#e6c09a',flee:8,walk:0,turnT:3});

  c.driver='player'; c.parked=false; P.inCar=c;
}
function exitCar(){
  const P=G.player, c=P.inCar; if(Math.abs(c.v)>140) return;
  for(const side of [1,-1]){
    const x=c.x+Math.cos(c.a+side*Math.PI/2)*(c.h/2+16), y=c.y+Math.sin(c.a+side*Math.PI/2)*(c.h/2+16);

  }

}

// ======================= FÍSICA DE VEHÍCULOS =======================
// Cuerpo rígido 2D: velocidad (vx,vy) independiente del morro, velocidad angular (w),
// agarre lateral de los neumáticos, masa e inercia. Choques por impulsos.
function carInertia(c){ return c.mass*(c.w*c.w+c.h*c.h)/2.5; }
function carCircles(c){
  const off=(c.w-c.h)/2, rr=c.h/2+2, ca=Math.cos(c.a), sa=Math.sin(c.a);
  return [[c.x+ca*off,c.y+sa*off,rr],[c.x-ca*off,c.y-sa*off,rr]];
}
function pushOut(x,y,r){
  let px=0,py=0;
  for(const s of solidsIn(x-r,y-r,x+r,y+r)){
    if(x+r<s.x||x-r>s.x+s.w||y+r<s.y||y-r>s.y+s.h) continue;
    const cx=clamp(x,s.x,s.x+s.w), cy=clamp(y,s.y,s.y+s.h);
    let dx=x-cx, dy=y-cy, d=Math.hypot(dx,dy);
    if(d<r){
      if(d<0.001){ const l=x-s.x, rr=s.x+s.w-x, t=y-s.y, b=s.y+s.h-y, m=Math.min(l,rr,t,b);
        if(m===l) px-=l+r; else if(m===rr) px+=rr+r; else if(m===t) py-=t+r; else py+=b+r; }
      else { px+=dx/d*(r-d); py+=dy/d*(r-d); }
    }
  }
  if(x-r<0) px+=r-x; if(y-r<0) py+=r-y; if(x+r>WW) px-=x+r-WW; if(y+r>WH) py-=y+r-WH;
  return [px,py];
}
function shakeCam(v){ G.shake=Math.max(G.shake||0,v); }
function sparks(x,y,n,vx,vy){
  for(let i=0;i<n;i++) G.parts.push({x,y,vx:(vx||0)*0.3+rand(-160,160),vy:(vy||0)*0.3+rand(-160,160),life:rand(.15,.4),c:Math.random()<.5?'#ffd76a':'#fff3c0',s:rand(1.5,3)});
}
function carImpact(c,impact,x,y){
  if(impact<90) return;
  const dmg=(impact-70)/11; c.hp-=dmg;
  if(impact>160){ sfx.crash(); sparks(x,y,Math.min(14,impact/30|0)); }
  const P=G.player;
  if(c===P.inCar){ shakeCam(Math.min(14,impact/40)); if(impact>380) hurtPlayer((impact-300)/25); }
}

function driveCar(c,dt,acc,brk,steer,hand,idle){
  if(c.hp<=0 && !c.burnt){ c.fire+=dt; acc=false; if(c.fire>4) { explodeCar(c); return; } }
  if(c.vx===undefined){ c.vx=Math.cos(c.a)*c.v; c.vy=Math.sin(c.a)*c.v; c.av=0; }
  const offroad=!isRoad(c.x,c.y);
  const top=c.max*(offroad?0.7:1);
  const ca=Math.cos(c.a), sa=Math.sin(c.a);
  let vf=c.vx*ca+c.vy*sa, vr=-c.vx*sa+c.vy*ca;
  // motor / freno / marcha atrás
  if(acc){ vf += (vf<-5 ? c.acc*3 : c.acc*Math.max(0,1.2-1.1*vf/top))*dt; }
  if(brk){ if(vf>15) vf-=c.acc*2.8*dt; else vf=Math.max(-c.max*0.38, vf-c.acc*0.9*dt); }
  const roll=(idle?520:offroad?240:110)*dt + Math.abs(vf)*0.18*dt;
  if(!acc&&!brk) vf = Math.abs(vf)<=roll?0:vf-Math.sign(vf)*roll;
  if(hand){ const f=420*dt; vf = Math.abs(vf)<=f?0:vf-Math.sign(vf)*f; }
  // agarre lateral: menos agarre = más derrape
  const spdR=Math.min(1,Math.abs(vf)/c.max);
  let grip=(offroad?4.5:8.5)*(1-0.4*spdR)*(c.gripMul||1);
  if(hand) grip=1.3;
  if(idle) grip=12;
  const vr0=vr;
  vr*=Math.exp(-grip*dt);
  // dirección
  c.steerS=(c.steerS||0)+(steer-(c.steerS||0))*Math.min(1,dt*9);
  const targetW = c.steerS*c.turn*1.1*Math.min(1,Math.abs(vf)/90)*Math.sign(vf)*(1-0.3*spdR)*(hand?1.5:1);
  c.av += (targetW-c.av)*Math.min(1,dt*(hand?3:Math.abs(vf)>20?7:3));
  c.a += c.av*dt;
  c.vx=ca*vf-sa*vr; c.vy=sa*vf+ca*vr;
  c.x+=c.vx*dt; c.y+=c.vy*dt;
  c.v=vf;
  // derrape: marcas y chirrido
  const sliding=Math.abs(vr0)>70 || (brk&&vf>220) || (hand&&Math.abs(vf)>120);
  if(sliding && !idle){
    for(const side of [-1,1]) G.decals.push({x:c.x-ca*(c.w/2-6)-sa*side*(c.h/2-3), y:c.y-sa*(c.w/2-6)+ca*side*(c.h/2-3), r:2.6, c:'rgba(20,20,20,.28)'}); // ruedas traseras
    c.screech=(c.screech||0)-dt;
    if(c===G.player.inCar && c.screech<=0){ noise(0.18,0.035); beep(1400+Math.random()*300,0.15,'sawtooth',0.008); c.screech=0.22; }
    if(Math.abs(vr0)>140 && Math.random()<0.4) G.parts.push({x:c.x-ca*c.w/2,y:c.y-sa*c.w/2,vx:rand(-20,20),vy:rand(-20,20),life:0.7,c:'rgba(200,200,200,.25)',s:rand(6,10)});
  }
  collideWalls(c);
  if(c.layer===1){ const h=hwyInfo(c.x,c.y);
    if(!h.on && h.f>=0.12 && c._px!==undefined){ c.x=c._px; c.y=c._py;
      const sp=Math.hypot(c.vx,c.vy); if(sp>140){ sparks(c.x,c.y,6,c.vx,c.vy); carImpact(c,sp*0.4,c.x,c.y); }
      c.vx*=-0.25; c.vy*=-0.25; c.av*=0.5; } }
  // río: solo se cruza por los puentes
  if(inWater(c.x,c.y)){ if(c._px!==undefined){ c.x=c._px; c.y=c._py; } c.vx*=-0.3; c.vy*=-0.3; c.av*=0.5; }
  c._px=c.x; c._py=c.y;
}
function collideWalls(c){
  const I=carInertia(c);
  for(const [cx,cy,rr] of carCircles(c)){
    const [px,py]=pushOut(cx,cy,rr); const pl=Math.hypot(px,py);
    if(pl<0.01) continue;
    c.x+=px; c.y+=py;
    const nx=px/pl, ny=py/pl;
    const rx=cx-nx*rr-c.x, ry=cy-ny*rr-c.y; // punto de contacto relativo al centro
    const vpx=c.vx-c.av*ry, vpy=c.vy+c.av*rx;
    const vn=vpx*nx+vpy*ny;
    if(vn<0){
      const rn=rx*ny-ry*nx;
      const j=-(1.25)*vn/(1/c.mass+rn*rn/I);
      c.vx+=j*nx/c.mass; c.vy+=j*ny/c.mass; c.av+=rn*j/I;
      // rozamiento contra la pared
      const tx=-ny, ty=nx, vt=vpx*tx+vpy*ty;
      const jt=clamp(-vt/(1/c.mass)*0.25,-Math.abs(j)*0.5,Math.abs(j)*0.5);
      c.vx+=jt*tx/c.mass; c.vy+=jt*ty/c.mass;
      carImpact(c,-vn,cx-nx*rr,cy-ny*rr);
      if(Math.abs(vt)>160 && Math.random()<0.6) sparks(cx-nx*rr,cy-ny*rr,2,c.vx,c.vy);
    }
  }
}
function collideCars(a,b){
  const P=G.player;
  for(const [ax,ay,ar] of carCircles(a)) for(const [bx,by,br] of carCircles(b)){
    const dx=bx-ax, dy=by-ay, d=Math.hypot(dx,dy), m=ar+br;
    if(d>=m||d<0.01) continue;
    const nx=dx/d, ny=dy/d;
    const kinA=a.driver==='ai', kinB=b.driver==='ai';
    const ima=kinA&&!kinB?0.15/a.mass:1/a.mass, imb=kinB&&!kinA?0.15/b.mass:1/b.mass;
    // separar según masa
    const pen=m-d, tot=ima+imb;
    a.x-=nx*pen*ima/tot; a.y-=ny*pen*ima/tot; b.x+=nx*pen*imb/tot; b.y+=ny*pen*imb/tot;
    // impulso en el punto de contacto
    const cx=ax+nx*ar, cy=ay+ny*ar;
    const rax=cx-a.x, ray=cy-a.y, rbx=cx-b.x, rby=cy-b.y;
    const Ia=carInertia(a), Ib=carInertia(b);
    const avx=(a.vx||0)-(a.av||0)*ray, avy=(a.vy||0)+(a.av||0)*rax;
    const bvx=(b.vx||0)-(b.av||0)*rby, bvy=(b.vy||0)+(b.av||0)*rbx;
    const vn=(bvx-avx)*nx+(bvy-avy)*ny;
    if(vn>=0) continue;
    const rna=rax*ny-ray*nx, rnb=rbx*ny-rby*nx;
    const j=-(1.3)*vn/(ima+imb+rna*rna/Ia+rnb*rnb/Ib);
    const wake=c=>{ if(c.driver==='ai'&&Math.abs(vn)>45){ c.driver=null; c.parked=true; c.angry=true; } };
    wake(a); wake(b);
    if(a.vx===undefined){ a.vx=Math.cos(a.a)*a.v; a.vy=Math.sin(a.a)*a.v; a.av=0; }
    if(b.vx===undefined){ b.vx=Math.cos(b.a)*b.v; b.vy=Math.sin(b.a)*b.v; b.av=0; }
    a.vx-=j*nx*ima; a.vy-=j*ny*ima; a.av=(a.av||0)-rna*j/Ia;
    b.vx+=j*nx*imb; b.vy+=j*ny*imb; b.av=(b.av||0)+rnb*j/Ib;
    // un poco de rozamiento entre carrocerías
    const tx=-ny, ty=nx, vt=(bvx-avx)*tx+(bvy-avy)*ty, jt=clamp(-vt*0.15/(ima+imb),-j*0.4,j*0.4);
    a.vx-=jt*tx*ima; a.vy-=jt*ty*ima; b.vx+=jt*tx*imb; b.vy+=jt*ty*imb;
    const imp=-vn;
    carImpact(a,imp*b.mass/(a.mass+b.mass)*2,cx,cy); carImpact(b,imp*a.mass/(a.mass+b.mass)*2,cx,cy);
    if(imp>100){
      if((a.driver==='cop'||b.driver==='cop') && (a===P.inCar||b===P.inCar)) setWanted(Math.max(G.wanted,1));
      if(imp>200 && (a===P.inCar||b===P.inCar) && Math.random()<0.3) beep(330,0.4,'sawtooth',0.04); // claxon enfadado
    }
    // mantener v (velocidad hacia delante) coherente para el resto del juego
    for(const c of [a,b]) c.v=c.vx*Math.cos(c.a)+c.vy*Math.sin(c.a);
  }
}

function updateWorld(dt){
  const P=G.player;
  // ---------- coches ----------
  for(const c of G.cars){
    if(c.dead) continue;
    if(c.burnt){ continue; }
    if(c.hp<=0 && c.driver!=='player'){ c.fire+=dt; if(c.fire>4){ explodeCar(c); continue; } }
    if(c.driver==='ai') aiTraffic(c,dt);
    else if(c.driver==='cop') aiCop(c,dt);
    else if(c.driver===null || c.parked){
      if(c.driver!=='player') driveCar(c,dt,false,false,0,false,true);
    }
    if(c.siren!==undefined) c.siren+=dt;
    c.layer=layerAt(c.x,c.y,c.layer);
  }
  // colisiones coche-coche (impulsos)
  const cs=G.cars.filter(c=>!c.dead);
  for(let i=0;i<cs.length;i++) for(let j=i+1;j<cs.length;j++){
    const a=cs[i], b=cs[j];
    if(a.driver==='ai'&&b.driver==='ai') continue;
    if((a.layer||0)!==(b.layer||0)) continue;
    const lim=(a.w+b.w)/2+4; if(Math.abs(a.x-b.x)>lim||Math.abs(a.y-b.y)>lim) continue;
    collideCars(a,b);
  }
  // peatón jugador vs coches
  if(!P.inCar) for(const c of cs){ if((c.layer||0)!==(P.layer||0)) continue; const d=dist(c.x,c.y,P.x,P.y); if(d<c.r+9){ const nx=(P.x-c.x)/(d||1), ny=(P.y-c.y)/(d||1); P.x=c.x+nx*(c.r+9); P.y=c.y+ny*(c.r+9); if(Math.abs(c.v)>150){ hurtPlayer(Math.abs(c.v)/12); c.v*=0.5; c.vx*=0.5; c.vy*=0.5; } } }
  G.cars=G.cars.filter(c=>!(c.dead&&!c.burnt));

  // ---------- policía ----------
  const cops=G.cars.filter(c=>c.driver==='cop');
  const want=G.wanted*2;
  if(cops.length<want && Math.random()<dt*1.2) spawnCop();
  if(G.wanted===0) for(const c of cops){ if(dist(c.x,c.y,P.x,P.y)>900){ c.dead=true; } else { c.driver=null; c.parked=true; } }
  if(G.wanted>0){
    const seen=cops.some(c=>dist(c.x,c.y,P.x,P.y)<650) || G.officers.some(o=>o.hp>0&&o.state==='out'&&dist(o.x,o.y,P.x,P.y)<500);
    if(!seen) G.evadeT+=dt; else G.evadeT=Math.max(0,G.evadeT-dt*2);
    if(G.evadeT>5+G.wanted*2.5){ G.wanted--; G.evadeT=0; toast(G.wanted? 'Pierdes una estrella':'¡Has despistado a la policía!',2); }
    // arresto
    const spd=P.inCar?Math.abs(P.inCar.v):0;
    const close=cops.some(c=>dist(c.x,c.y,P.x,P.y)<75 && Math.abs(c.v)<120) || G.officers.some(o=>o.hp>0&&o.state==='out'&&dist(o.x,o.y,P.x,P.y)<45);
    if(close && spd<40){ G.bustT+=dt; if(G.bustT>2.5 && !G.dead){ G.dead='busted'; G.deadT=3.5; sfx.star(); } } else G.bustT=Math.max(0,G.bustT-dt);
  } else G.bustT=0;

  // ---------- tráfico / peatones: mantener densidad ----------
  const traffic=G.cars.filter(c=>c.driver==='ai').length;
  if(traffic<30) spawnTraffic(false);
  for(const c of G.cars){
    if(c.owned||c===P.inCar||c.driver==='cop') continue;
    if(dist(c.x,c.y,P.x,P.y)>2200) c.dead=true;
  }
  G.cars=G.cars.filter(c=>!c.dead||c.burnt).filter(c=>!(c.burnt&&dist(c.x,c.y,P.x,P.y)>2500));
  for(const p of G.peds){
    if(p.dead){ p.deadT-=dt; continue; }
    updatePed(p,dt);
    for(const c of cs) if(c.driver!=='player' && !c.layer && Math.abs(c.v)>120 && dist(c.x,c.y,p.x,p.y)<c.r+5) killPed(p);
  }
  G.peds=G.peds.filter(p=>!(p.dead&&p.deadT<=0) && dist(p.x,p.y,P.x,P.y)<1700);
  for(let k=0;k<3&&G.peds.filter(p=>!p.dead).length<80;k++) spawnPed(false);

  // ---------- matones ----------
  for(const t of G.thugs){
    if(t.hp<=0) continue;
    const d=dist(t.x,t.y,P.x,P.y);
    t.a=Math.atan2(P.y-t.y,P.x-t.x);
    if(d>220){ t.x+=Math.cos(t.a)*95*dt; t.y+=Math.sin(t.a)*95*dt; t.walk+=dt*10; }
    else if(d<120){ t.x-=Math.cos(t.a)*60*dt; t.y-=Math.sin(t.a)*60*dt; }
    else { t.x+=Math.cos(t.a+Math.PI/2)*50*dt*(t.side||1); t.y+=Math.sin(t.a+Math.PI/2)*50*dt*(t.side||1); if(Math.random()<dt) t.side=-(t.side||1); }
    resolve(t,9);
    t.cool-=dt;
    if(t.cool<=0 && d<480){ fire(t.x,t.y,t.a,'thug',0.12,9); t.cool=rand(0.7,1.5); }
  }
  for(const t of G.thugs) if(t.hp<=0 && !t.gone){ t.gone=true; G.decals.push({x:t.x,y:t.y,r:14,c:'rgba(120,0,0,.7)'}); G.kills++; G.money+=rand(100,600)|0; }
  G.thugs=G.thugs.filter(t=>t.hp>0);

  // ---------- agentes a pie ----------
  for(const o of G.officers){
    if(o.hp<=0) continue;
    const d=dist(o.x,o.y,P.x,P.y);
    const carGone=!o.car||o.car.dead||o.car.burnt;
    const playerFled=d>700 || (P.inCar && Math.abs(P.inCar.v)>200 && d>420);
    if(o.state==='out' && (G.wanted===0 || playerFled)) o.state='return';
    if(o.state==='return' && G.wanted>0 && !playerFled && d<500) o.state='out';
    if(o.state==='return'){
      if(carGone){ o.a=Math.atan2(o.y-P.y,o.x-P.x); o.x+=Math.cos(o.a)*80*dt; o.y+=Math.sin(o.a)*80*dt; o.walk+=dt*10; if(d>900) o.gone=true; }
      else { o.a=Math.atan2(o.car.y-o.y,o.car.x-o.x); o.x+=Math.cos(o.a)*150*dt; o.y+=Math.sin(o.a)*150*dt; o.walk+=dt*14;
        if(dist(o.x,o.y,o.car.x,o.car.y)<o.car.w/2+14) o.gone=true; }
      resolve(o,8); continue;
    }
    o.a=Math.atan2(P.y-o.y,P.x-o.x);
    const shooting=G.wanted>=2;
    const keep=shooting?190:20; // con 1 estrella van a por ti para esposarte
    if(d>keep+40){ o.x+=Math.cos(o.a)*(shooting?120:140)*dt; o.y+=Math.sin(o.a)*(shooting?120:140)*dt; o.walk+=dt*12; }
    else if(shooting && d<keep-60){ o.x-=Math.cos(o.a)*70*dt; o.y-=Math.sin(o.a)*70*dt; o.walk+=dt*8; }
    else if(shooting){ o.x+=Math.cos(o.a+Math.PI/2)*55*dt*o.side; o.y+=Math.sin(o.a+Math.PI/2)*55*dt*o.side; o.walk+=dt*8; if(Math.random()<dt*0.8) o.side*=-1; }
    resolve(o,8);
    o.cool-=dt;
    if(shooting && o.cool<=0 && d<430){
      fire(o.x,o.y,o.a,'cop',P.inCar?0.09:0.13,G.wanted>=4?11:8);
      o.cool=rand(0.55,1.2)*(G.wanted>=4?0.75:1);
    }
    if(Math.random()<dt*0.25) beep(o.dea?260:300,0.12,'sawtooth',0.015); // "¡Alto, policía!"
  }
  for(const o of G.officers) if(o.hp<=0 && !o.dead){ o.dead=true; G.decals.push({x:o.x,y:o.y,r:14,c:'rgba(120,0,0,.7)'}); G.bodies=(G.bodies||[]); G.bodies.push({x:o.x,y:o.y,a:o.a,t:40,col:o.dea?'#1b1b1b':'#1d2b4a'}); setWanted(Math.max(G.wanted+1,3)); }
  G.officers=G.officers.filter(o=>!o.dead&&!o.gone&&dist(o.x,o.y,P.x,P.y)<1600);
  if(G.bodies){ for(const b of G.bodies) b.t-=dt; G.bodies=G.bodies.filter(b=>b.t>0); }

  // ---------- balas ----------
  for(const b of G.bullets){
    const steps=3;
    for(let s=0;s<steps&&b.life>0;s++){
      b.x+=b.vx*dt/steps; b.y+=b.vy*dt/steps;
      if(hitSolid(b.x,b.y,1)){ b.life=0; G.parts.push({x:b.x,y:b.y,vx:rand(-40,40),vy:rand(-40,40),life:.3,c:'#ffd',s:3}); break; }
      if(b.owner==='player'){
        for(const p of G.peds) if(!p.dead&&dist(p.x,p.y,b.x,b.y)<9){ killPed(p); b.life=0; if(G.thugs.length===0) setWanted(Math.max(G.wanted,copNear(800)?2:1)); }
        for(const o of G.officers) if(o.hp>0&&dist(o.x,o.y,b.x,b.y)<11){ o.hp-=b.dmg; b.life=0; G.parts.push({x:b.x,y:b.y,vx:rand(-60,60),vy:rand(-60,60),life:.4,c:'#900',s:4}); setWanted(Math.max(G.wanted,2)); }
        for(const t of G.thugs) if(t.hp>0&&dist(t.x,t.y,b.x,b.y)<11){ t.hp-=b.dmg; b.life=0; G.parts.push({x:b.x,y:b.y,vx:rand(-60,60),vy:rand(-60,60),life:.4,c:'#900',s:4}); }
        for(const c of G.cars) if(!c.dead&&!c.burnt&&c!==P.inCar&&dist(c.x,c.y,b.x,b.y)<c.r){ c.hp-=b.dmg*0.5; b.life=0; if(c.driver==='cop') setWanted(Math.max(G.wanted,2)); if(c.driver==='ai'){c.driver=null;c.parked=true;} }
      } else {
        if(dist(P.x,P.y,b.x,b.y)<(P.inCar?P.inCar.r:10)){ b.life=0; if(P.inCar) {P.inCar.hp-=b.dmg*0.6; hurtPlayer(b.dmg*0.3);} else hurtPlayer(b.dmg); }
      }
    }
    b.life-=dt;
  }
  G.bullets=G.bullets.filter(b=>b.life>0);
  for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=1-2*dt; p.vy*=1-2*dt; p.life-=dt; }
  G.parts=G.parts.filter(p=>p.life>0);
  // humo/fuego de coches dañados
  for(const c of G.cars){
    if(c.burnt){ if(Math.random()<dt*4) G.parts.push({x:c.x+rand(-10,10),y:c.y+rand(-10,10),vx:rand(-10,10),vy:rand(-40,-10),life:1.5,c:'rgba(60,60,60,.5)',s:rand(8,16)}); continue; }
    if(c.hp<c.maxhp*0.35 && Math.random()<dt*8) G.parts.push({x:c.x,y:c.y,vx:rand(-15,15),vy:rand(-50,-20),life:1,c:c.hp<=0?'#f73':'rgba(80,80,80,.5)',s:rand(6,12)});
  }
  if(G.decals.length>400) G.decals.splice(0,G.decals.length-400);
}

function aiTraffic(c,dt){
  const P=G.player, r0=ROADS[c.road];
  // ¿obstáculo delante?
  let target=SPEED_OF[r0.kind];
  const fx=c.x+Math.cos(c.a)*55, fy=c.y+Math.sin(c.a)*55;
  for(const o of G.cars){ if(o!==c && !o.dead && (o.layer||0)===(c.layer||0) && Math.abs(o.x-fx)<40 && Math.abs(o.y-fy)<40 && dist(o.x,o.y,fx,fy)<36){ target=0; break; } }
  if(dist(P.x,P.y,fx,fy)<38) { target=0; if(Math.random()<dt*0.5) beep(400,0.2,'sawtooth',0.02); }
  for(const p of G.peds) if(!p.dead && Math.abs(p.x-fx)<30 && dist(p.x,p.y,fx,fy)<26){ target=0; break; }
  // frenar en curvas cerradas
  const ahead=pointAt(r0,c.s+c.dir*60), here=pointAt(r0,c.s);
  if(Math.abs(angDiff(here.a,ahead.a))>0.5) target=Math.min(target,110);
  c.v += clamp(target-c.v,-520*dt,200*dt);
  const ps=c.s; c.s+=c.v*dt*c.dir;
  for(const x of r0.cross){
    if((x.s-ps)*(x.s-c.s)<=0 && c.lastX!==x.id){
      c.lastX=x.id;
      if(Math.random()<0.4){ c.road=x.other; c.s=x.os; c.dir=Math.random()<.5?1:-1; break; }
    }
  }
  const r1=ROADS[c.road];
  if(c.s<=0){ c.s=0; c.dir=1; c.lastX=-1; } else if(c.s>=r1.len){ c.s=r1.len; c.dir=-1; c.lastX=-1; }
  const p=trafficPos(c); c.x=p.x; c.y=p.y; c.a+=angDiff(c.a,p.a)*Math.min(1,dt*9);
  c.vx=Math.cos(c.a)*c.v; c.vy=Math.sin(c.a)*c.v; c.av=0;
}
function spawnCop(){
  const P=G.player;
  for(let t=0;t<30;t++){
    const a=rand(0,Math.PI*2), d=rand(850,1150);
    const x=P.x+Math.cos(a)*d, y=P.y+Math.sin(a)*d;
    if(!isRoad(x,y)||hitSolid(x,y,22)) continue;
    spawnCar(G.wanted>=4||G.stage===9?'dea':'cop',x,y,Math.atan2(P.y-y,P.x-x),{driver:'cop',v:200,siren:0});
    return;
  }
}
function aiCop(c,dt){
  const P=G.player;
  const d=dist(c.x,c.y,P.x,P.y);
  // con agentes fuera, el coche se queda parado esperándolos
  if(c.unloaded){
    driveCar(c,dt,false,false,0,false,true);
    if(!G.officers.some(o=>o.car===c)) c.unloaded=false;
    return;
  }
  const footP=!P.inCar||Math.abs(P.inCar.v)<60;
  const wantsOut=G.officers.length<6 && ((G.wanted>=2 && d<330) || (G.wanted>=1 && footP && d<220));
  if(wantsOut){
    driveCar(c,dt,false,true,0,true);
    if(Math.abs(c.v)<40){
      c.unloaded=true;
      const n=G.wanted>=3?2:1;
      for(let i=0;i<n;i++){
        const side=i?-1:1, ang=c.a+side*Math.PI/2;
        let x=c.x+Math.cos(ang)*(c.h/2+12), y=c.y+Math.sin(ang)*(c.h/2+12);
        if(hitSolid(x,y,8)||inWater(x,y)){ x=c.x-Math.cos(ang)*(c.h/2+12); y=c.y-Math.sin(ang)*(c.h/2+12); }
        G.officers.push({x,y,a:ang,hp:60,car:c,cool:rand(0.6,1.2),walk:0,side:Math.random()<.5?1:-1,state:'out',dea:c.type==='dea'});
      }
      beep(520,0.08,'square',0.03);
    }
    return;
  }
  let ta=Math.atan2(P.y-c.y,P.x-c.x);
  if(c.rev>0){ c.rev-=dt; driveCar(c,dt,false,true,Math.sign(angDiff(c.a,ta))*-1,false); return; }
  const diff=angDiff(c.a,ta);
  const steer=clamp(diff*2,-1,1);
  const wantFast = d>120;
  driveCar(c,dt,wantFast && Math.abs(diff)<2.2,!wantFast && c.v>60,steer,Math.abs(diff)>1.2&&c.v>250);
  if(Math.abs(c.v)<25 && wantFast){ c.stuck+=dt; if(c.stuck>1.2){ c.rev=0.9; c.stuck=0; } } else c.stuck=0;
}

function respawn(){
  const P=G.player, how=G.dead;
  G.dead=false; G.wanted=0; G.evadeT=0; G.bustT=0; G.thugs=G.thugs.filter(()=>G.stage===4);
  if(how==='wasted'){ const fee=Math.min(G.money,Math.round(G.money*0.05)+500); G.money-=fee; P.x=LOC.hospital.x; P.y=LOC.hospital.y+10; toast('Facturas del hospital: -$'+fee.toLocaleString(),4); }
  else { const lost=G.product; G.product=0; P.gun=false; P.ammo=0; P.x=LOC.dea.x; P.y=LOC.dea.y+10; G.heat=0; toast('Saul te ha sacado bajo fianza. Has perdido '+lost+' lb y tus armas.',5); }
  P.hp=100; P.armor=0; P.inCar=null;
  G.cars.forEach(c=>{ if(c.driver==='cop') c.dead=true; }); G.officers=[];
  if(G.stage===9) setWanted(3);
  if(G.stage===4 && G.thugs.length===0) spawnThugs(4);
  // asegúrate de que la autocaravana existe
  if(G.rvId && !G.cars.some(c=>c.id===G.rvId && !c.burnt)){ const rv=spawnCar('rv',LOC.rvlot.parkX,LOC.rvlot.parkY,LOC.rvlot.parkA,{owned:true}); G.rvId=rv.id; toast('Saul te consiguió otra autocaravana (en el concesionario).',5); }
}

    const P=G.player, rv=G.cars.find(c=>c.id===G.rvId);
    localStorage.setItem('heisenberg_save',JSON.stringify({money:G.money,product:G.product,purity:G.purity,heat:G.heat,clock:G.clock,stage:G.stage,loyalty:G.loyalty,
      gun:P.gun,ammo:P.ammo,armor:P.armor,px:P.x,py:P.y,hasRv:!!G.rvId,rvx:rv?rv.x:0,rvy:rv?rv.y:0,ended:G.ended}));
  }catch(e){}
}
function hasSave(){ try{ return !!localStorage.getItem('heisenberg_save'); }catch(e){ return false; } }
function load(){
  let s; try{ s=JSON.parse(localStorage.getItem('heisenberg_save')); }catch(e){}
  newGame(); if(!s) return false;
  Object.assign(G,{money:s.money,product:s.product,purity:s.purity,heat:s.heat,clock:s.clock,stage:s.stage,loyalty:s.loyalty,ended:s.ended});
  const P=G.player; P.gun=s.gun; P.ammo=s.ammo; P.armor=s.armor; P.x=LOC.home.x; P.y=LOC.home.y-10;
  if(s.hasRv){ const rv=spawnCar('rv',LOC.home.parkX-Math.cos(LOC.home.parkA)*150,LOC.home.parkY-Math.sin(LOC.home.parkA)*150,LOC.home.parkA,{owned:true,name:'Autocaravana'}); G.rvId=rv.id; }
  if(G.stage===4) spawnThugs(4);
  if(G.stage===9) setWanted(3);
  return true;
}

// ======================= RENDER =======================
function nightAmount(){
  const h=G.clock/60;
  if(h>=7&&h<=18) return 0;
  if(h>18&&h<21) return (h-18)/3;
  if(h>=5&&h<7) return 1-(h-5)/2;
  return 1;
}

let VIS=[], LIGHTS=[], RIVER_PATH=null, NOISE_PAT=null;

function initRender(){
  RIVER_PATH=new Path2D(); RIVER.forEach((p,i)=>i?RIVER_PATH.lineTo(p[0],p[1]):RIVER_PATH.moveTo(p[0],p[1]));
  const n=document.createElement('canvas'); n.width=n.height=96; const g=n.getContext('2d');
  for(let i=0;i<900;i++){ g.fillStyle=Math.random()<.5?'rgba(0,0,0,.07)':'rgba(255,255,255,.06)'; g.fillRect(Math.random()*96,Math.random()*96,1+Math.random()*2,1+Math.random()*2); }

}
function rot(x,y,a,fn){ ctx.save(); ctx.translate(x,y); ctx.rotate(a); fn(); ctx.restore(); }

function drawWorld(t){
  if(!RIVER_PATH) initRender();
  const z=cam.z, x0=cam.x, y0=cam.y, x1=x0+VW/z, y1=y0+VH/z;

    ctx.fillStyle='rgba(255,255,255,.12)'; ctx.beginPath(); ctx.arc(d.x-d.r*0.3,d.y-d.r*0.3,d.r*0.45,0,7); ctx.fill(); }

        ctx.fillStyle='#e9e3d4'; roundRect(px-38,py-22,76,44,10); ctx.fill(); ctx.fillStyle='#3fb6d8'; roundRect(px-32,py-16,64,32,8); ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(px-20,py-4); ctx.quadraticCurveTo(px-8,py-10,px+4,py-4); ctx.quadraticCurveTo(px+14,py+2,px+22,py-4); ctx.stroke(); }
      ctx.strokeStyle='rgba(130,100,70,.85)'; ctx.lineWidth=3; ctx.strokeRect(L.x-4,L.y-4,L.x2-L.x+8,L.y2-L.y+8);
      continue; }
    ctx.fillStyle='#4f5054'; ctx.fillRect(L.x,L.y,L.x2-L.x,L.y2-L.y);

    for(let s=60;s<r.len;s+=200){ const p=pointAt(r,s); if(p.x<x0-40||p.x>x1+40||p.y<y0-40||p.y>y1+40) continue;
      const side=(Math.floor(s/200)%2)?1:-1, n=p.a+Math.PI/2*side, off=r.w/2+(r.kind==='hwy'?4:7);

      ctx.strokeStyle='#555'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx-Math.cos(n)*14,ly-Math.sin(n)*14); ctx.stroke();
      ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(lx,ly,3,0,7); ctx.fill();
      ctx.fillStyle='#ffe9a8'; ctx.beginPath(); ctx.arc(lx-Math.cos(n)*14,ly-Math.sin(n)*14,2.5,0,7); ctx.fill();
